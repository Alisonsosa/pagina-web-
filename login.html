<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso y Registro - AprendeYa</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      
      <div class="login-header">
        <a href="index.html" class="logo">Aprende<span>Ya</span></a>
        <h2 id="authTitle">¡Hola de nuevo!</h2>
        <p id="authSubtitle">Ingresa tus credenciales para acceder a tus cursos</p>
      </div>

      <!-- Social Logins (Google y GitHub OAuth) -->
      <div class="social-login" id="socialAuthGroup">
        <button type="button" class="btn-social" id="btnGoogleAuth">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Google
        </button>
        <button type="button" class="btn-social" id="btnGithubAuth">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          GitHub
        </button>
      </div>

      <div class="divider" id="socialDivider">
        <span>o con tu correo</span>
      </div>

      <div id="mensajeAuth" class="mensaje-login"></div>

      <!-- FORMULARIO 1: LOGIN -->
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="loginEmail">Correo electrónico</label>
          <input type="email" id="loginEmail" placeholder="nombre@ejemplo.com" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="loginPassword" placeholder="••••••••" required>
            <button type="button" class="toggle-btn" data-target="loginPassword">👁️</button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember">
            <span>Recordarme</span>
          </label>
          <a href="#" id="linkForgotPassword" class="forgot-password">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Iniciar Sesión</button>
      </form>

      <!-- FORMULARIO 2: REGISTRO NUEVO USUARIO -->
      <form id="registerForm" class="auth-form" style="display: none;">
        <div class="form-group">
          <label for="regName">Nombre completo</label>
          <input type="text" id="regName" placeholder="Tu nombre completo" required>
        </div>

        <div class="form-group">
          <label for="regEmail">Correo electrónico</label>
          <input type="email" id="regEmail" placeholder="nombre@ejemplo.com" required>
        </div>

        <div class="form-group">
          <label for="regRole">Tipo de Usuario</label>
          <select id="regRole" class="form-control" required>
            <option value="estudiante">Estudiante</option>
            <option value="instructor">Instructor</option>
          </select>
        </div>

        <div class="form-group">
          <label for="regPassword">Contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="regPassword" placeholder="••••••••" required>
            <button type="button" class="toggle-btn" data-target="regPassword">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Crear Cuenta</button>
      </form>

      <!-- FORMULARIO 3: RECUPERAR CONTRASEÑA -->
      <form id="forgotForm" class="auth-form" style="display: none;">
        <div class="form-group">
          <label for="forgotEmail">Correo electrónico registrado</label>
          <input type="email" id="forgotEmail" placeholder="nombre@ejemplo.com" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Enviar enlace de recuperación</button>
      </form>

      <!-- Pie del Formulario -->
      <div class="login-footer">
        <p id="footerText">¿Aún no tienes cuenta? <a href="#" id="linkRegister">Regístrate aquí</a></p>
      </div>

    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
